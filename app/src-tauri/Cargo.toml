[package]
name = "tormin"
version = "1.0.0"
description = "Minimalist BitTorrent client"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519)
name = "tormin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
